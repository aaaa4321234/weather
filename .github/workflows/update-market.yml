name: Update Market

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch USD/JPY data
        run: |
          CURRENT_MONTH=$(TZ=Asia/Tokyo date +%Y%m)
          PREVIOUS_MONTH=$(TZ=Asia/Tokyo date -d "1 month ago" +%Y%m)

          curl "https://www.stat-search.boj.or.jp/api/v1/getDataCode?format=json&lang=jp&db=FM08&code=FXERD04&startDate=${PREVIOUS_MONTH}&endDate=${CURRENT_MONTH}" \
            -o usd_jpy.json

          echo "=== Top level ==="
          jq 'keys' usd_jpy.json
          
          echo "=== RESULTSET ==="
          jq '.RESULTSET | keys' usd_jpy.json
          
          echo "=== RESULTSET[0] ==="
          jq '.RESULTSET[0] | keys' usd_jpy.json

          echo "=== VALUES ==="
          jq '.RESULTSET[0].VALUES' usd_jpy.json
