name: Update Market

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Fetch USD/JPY data
        run: |
          curl "https://api.stlouisfed.org/fred/series/observations?series_id=DEXJPUS&api_key=${{ secrets.FRED_API_KEY }}&file_type=json" \
          -o usd_jpy.json
