name: Update Weather

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch weather data
        run: |
          curl "https://api.open-meteo.com/v1/forecast?latitude=35.6812&longitude=139.7671&current=temperature_2m,weather_code&timezone=Asia%2FTokyo" \
          -o weather.json

      - name: Create weather.txt
        run: |
          TEMP=$(jq '.current.temperature_2m' weather.json)
          CODE=$(jq '.current.weather_code' weather.json)
          case "$CODE" in
            0)
              WEATHER="快晴"
              ;;
            1)
              WEATHER="晴れ"
              ;;
            2)
              WEATHER="一部曇り"
              ;;
            3)
              WEATHER="曇り"
              ;;
            45)
              WEATHER="霧"
              ;;
            48)
              WEATHER="着氷性の霧"
              ;;
            51)
              WEATHER="弱い霧雨"
              ;;
            53)
              WEATHER="霧雨"
              ;;
            55)
              WEATHER="強い霧雨"
              ;;
            56)
              WEATHER="弱い着氷性霧雨"
              ;;
            57)
              WEATHER="強い着氷性霧雨"
              ;;
            61)
              WEATHER="弱い雨"
              ;;
            63)
              WEATHER="雨"
              ;;
            65)
              WEATHER="強い雨"
              ;;
            66)
              WEATHER="弱い着氷性の雨"
              ;;
            67)
              WEATHER="強い着氷性の雨"
              ;;
            71)
              WEATHER="弱い雪"
              ;;
            73)
              WEATHER="雪"
              ;;
            75)
              WEATHER="強い雪"
              ;;
            77)
              WEATHER="霧雪"
              ;;
            80)
              WEATHER="弱いにわか雨"
              ;;
            81)
              WEATHER="にわか雨"
              ;;
            82)
              WEATHER="激しいにわか雨"
              ;;
            85)
              WEATHER="弱いにわか雪"
              ;;
            86)
              WEATHER="強いにわか雪"
              ;;
            95)
              WEATHER="雷雨"
              ;;
            96)
              WEATHER="ひょうを伴う雷雨"
              ;;
            99)
              WEATHER="激しいひょうを伴う雷雨"
              ;;
            *)
              WEATHER="不明"
              ;;
          esac
          echo "東京：${WEATHER} ${TEMP}℃" > weather.txt

      - name: Commit updated weather
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.txt
          git commit -m "Update weather" || exit 0
          git push
